<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Create Planet,Discover Universe" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <link rel="shortcut icon" href="icon.png" type="image/x-icon" />
    <title>Planet Generator 2</title>
    <style>
      body {
        --margin: 8px;
        margin: var(--margin);
        background-color: #fff;
        /* overflow: hidden; */
      }
      h1 {
        font-weight: 500;
      }
      h2 {
        font-weight: 100;
        font-size: 1.2rem;
      }
      #result {
        --resultSize: min(500px, calc(100vw - 2 * var(--margin)));
        width: var(--resultSize);
        height: var(--resultSize);
        border: 1px solid #ddd;
        position: relative;
        overflow: hidden;
        background-color: #000000;
        background-image: url("image/bg0.png");
        background-size: var(--resultSize) var(--resultSize);
        background-position: center;
        background-repeat: repeat;
        background-blend-mode: color;
        resize: both;
      }
      #status {
        color: #555;
      }
      #project {
        font-weight: 300;
      }
      #project a {
        color: inherit;
      }
      #cameraButton {
        width: 150px;
        height: 50px;
      }
      #cameraButton * {
        width: 100%;
        height: 100%;
      }
      /* #background {
      width: var(--resultSize);
      height: var(--resultSize);
      
      transition: none;
    } */
    </style>
    <link rel="stylesheet" href="planet.css" />
  </head>
  <body onload="load()">
    <header>
      <h1 id="title">Planet Generator 2</h1>
      <h2>Create Planet,Discover Universe</h2>
    </header>
    <hr />
    <div id="workspace">
      <div id="result" style="background-color: rgba(0, 0, 0, 0.5)">
        <div id="planet">
          <img id="asterism" src="image/asterism0.png" style="opacity: 0.7" />
          <div id="star" style="opacity: 1"></div>
          <div id="innerLight"></div>
          <img id="iceSheet" src="image/iceSheet0.png" />
          <canvas id="shadow" width="160" height="160"></canvas>
          <img class="ring" id="ringFront" src="image/ring2.png" loading="lazy" />
          <img class="ring" id="ringBehind" src="image/ring2.png" loading="lazy" />
          <img id="cloud" src="image/cloudGas0.png" alt="" />
          <img id="detail" src="image/detail0.png" alt="" />
          <div id="base"></div>
        </div>
        <!-- <img src="image/bg1.jpg"  id="background" /> -->
      </div>
      <hr />
      <div id="control" style="position: relative; z-index: 999">
        <div style="max-width: 500px">
          <button onclick="randomGenerate();Math.seed=Math.random()">随机生成</button>
          <!-- <button onclick="changeMode('displayData',this);">切换数据显示模式</button> -->
          <button onclick="changeMode('useCustomData',this)">打开工作台</button>
          <button onclick="changeMode('displayStar',this)">隐藏恒星</button>
          <!-- <button onclick="this.style.display = 'none';document.getElementById('result').style.resize='both';document.getElementById('information').innerHTML='已切换，刷新页面即可关闭并回到默认状态'">自由调节画布大小</button> -->
          <button onclick="changeMode('displayBackground',this)">隐藏背景</button>
          <button onclick="location.search=''">返回默认界面</button>
          <input id="seedEdit" autocomplete="off" onchange="Math.seed = this.value;randomGenerate();Math.seed=Math.random()" placeholder="请输入种子（仅限数字）" />
          <button onclick="share()">保存种子</button>
          <button onclick="changeMode('useAnimation',this)">关闭动画</button>
          <hr />
          <span style="display: flex" id="cameraButton">
            <button id="moveLeft">←</button>
            <span style="display: flex; flex-direction: column">
              <button id="moveUp">↑</button>
              <button id="moveDown">↓</button>
            </span>
            <button id="moveRight">→</button>
          </span>
          <span>
            <div id="joystickInner"></div>
            <div id="joystickCircle"></div>
          </span>
          <button id="scaleUp">|← →|</button>
          <button id="scaleDown">|→ ←|</button>
          <button onclick="goHome()">回到原位</button>
        </div>
        <hr />
        <textarea id="customData" cols="50" rows="40" placeholder="请输入行星JSON数据" style="width: 100%; max-width: 500px; height: 250px; display: none" onchange="try{generate(JSON.parse(this.value))}catch(err){document.getElementById('information').innerHTML=err}"></textarea>
        <pre id="information" style="word-wrap: break-word; word-break: break-all; white-space: pre-wrap">加载完成!</pre>
      </div>
      <div id="project">
        <p>Contributor:<a href="https://github.com/Nsakrty">Nsakrty</a>,<a href="https://v.douyin.com/irWrBwB9/">Hliva</a>,<a href="https://v.douyin.com/ifjgtuH4/">Earth</a>,<a href="https://space.bilibili.com/1595229142">Firstclassuniver</a></p>
        <p>Github:<a href="https://github.com/Nsakrty/PlanetGenerator2">Click me</a></p>
        <p>PG2 Seed calculator:<a href="seedCalc.html">Click me</a></p>
      </div>
    </div>
    <script src="generator.js"></script>
    <script src="shadowDrawing.js"></script>
    <script src="colorTranslate.js"></script>
    <script src="longPress.js"></script>
    <script>
      result = document.getElementById("result");
      function share() {
        let shareSeed = "";
        try {
          shareSeed = `${planetData.seed}`;
        } catch {
          void 0;
        }
        let copyEvent = navigator.clipboard.writeText(shareSeed);
        shareSeed = shareSeed ? shareSeed : "目前无种子";
        document.getElementById("information").innerHTML = "行星种子:" + shareSeed;
      }
      function load() {
        document.getElementById("result").style.backgroundColor = "rgba(0,0,0,0.5)";
        drawShadowWithAnimation((currentShadowSize = 0.75), (currentShadowDirection = 0)); //行星光照初始化
        document.getElementById("information").innerHTML = "加载完成!";
      }

      function changeMode(name, runElement) {
        switch (name) {
          // case "displayData":
          //   config.showPlanetData ^= 1;
          //   document.getElementById("information").innerHTML = "已切换，效果将在下次生成时应用。";
          //   break;
          case "displayStar":
            runElement.innerHTML = (config.showStar ^= 1) ? "隐藏恒星" : "显示恒星";
            document.getElementById("star").style.display = config.showStar ? "block" : "none";
            document.getElementById("asterism").style.display = config.showStar ? "block" : "none";
            document.getElementById("information").innerHTML = "切换成功";
            break;
          case "displayBackground":
            runElement.innerHTML = (config.showBackground ^= 1) ? "隐藏背景" : "显示背景";
            document.getElementById("result").style.backgroundImage = config.showBackground ? "url(image/bg0.png)" : "none";
            document.getElementById("result").style.backgroundColor = config.showBackground ? "#00000099" : "#000000";
            document.getElementById("information").innerHTML = "切换成功";
            break;
          case "useAnimation":
            config.useAnimation ^= 1;
            document.getElementById("result").style.setProperty("--animationDuringTime", config.useAnimation ? "0.3s" : "0s");
            runElement.innerHTML = config.useAnimation ? "关闭动画" : "开启动画";
            document.getElementById("information").innerHTML = "已切换，效果将在下次生成时应用。";
            break;
          case "useCustomData":
            config.useCustomData ^= 1;
            runElement.innerHTML = config.useCustomData ? "关闭工作台" : "打开工作台";
            document.getElementById("customData").style.display = config.useCustomData ? "block" : "none";
            document.getElementById("information").innerHTML = "已切换";
        }
      }
      function scale(value, mode = "add") {
        let currentScale = parseFloat(window.getComputedStyle(result).getPropertyValue("--cameraScale"));
        if (mode === "add") {
          if (currentScale + value > 0.1) result.style.setProperty("--cameraScale", currentScale + value);
        } else if (mode === "set") {
          if (value > 0.1) result.style.setProperty("--cameraScale", value);
        }
      }
      function moveX(value, mode = "add") {
        let currentScale = parseFloat(window.getComputedStyle(result).getPropertyValue("--cameraScale"));
        let currentX = parseFloat(window.getComputedStyle(result).getPropertyValue("--cameraX"));
        if (mode === "add") {
          result.style.setProperty("--cameraX", `${currentX + value / currentScale}px`);
        } else if (mode === "set") {
          result.style.setProperty("--cameraX", `${value}px`);
        }
      }
      function moveY(value, mode = "add") {
        let currentScale = parseFloat(window.getComputedStyle(result).getPropertyValue("--cameraScale"));
        let currentY = parseFloat(window.getComputedStyle(result).getPropertyValue("--cameraY"));
        if (mode === "add") {
          result.style.setProperty("--cameraY", `${currentY + value / currentScale}px`);
        } else if (mode === "set") {
          result.style.setProperty("--cameraY", `${value}px`);
        }
      }
      function goHome() {
        moveX(0, "set");
        moveY(0, "set");
        scale(1, "set");
      }

      longPress(document.getElementById("moveUp"), () => moveY(20));
      longPress(document.getElementById("moveDown"), () => moveY(-20));
      longPress(document.getElementById("moveLeft"), () => moveX(-20));
      longPress(document.getElementById("moveRight"), () => moveX(20));
      longPress(document.getElementById("scaleUp"), () => scale(0.1));
      longPress(document.getElementById("scaleDown"), () => scale(-0.1));
    </script>
  </body>
</html>
