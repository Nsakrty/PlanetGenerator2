<html lang="zh-cn">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Create Planet,Discover Universe" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <link rel="shortcut icon" href="icon.png" type="image/x-icon" />
    <title>Planet Generator 2</title>
    <style>
      body {
        --margin: 8px;
        margin: var(--margin);
        background-color: #fff;
        /* overflow: hidden; */
      }
      h1 {
        font-weight: 500;
      }
      h2 {
        font-weight: 100;
        font-size: 1.2rem;
      }
      #result {
        --resultSize: min(500px, calc(100vw - 2 * var(--margin)));
        width: var(--resultSize);
        height: var(--resultSize);
        /* border: 1px solid #ddd; */
        position: relative;
        overflow: hidden;
        background-color: #000000;
        background-image: url("image/bg0.png");
        background-size: var(--resultSize) var(--resultSize);
        background-position: center;
        background-repeat: repeat;
        background-blend-mode: color;
        resize: both;
      }
      #status {
        color: #555;
      }
      #project {
        font-weight: 300;
      }
      #project a {
        color: inherit;
      }
      button {
        user-select: none;
        -webkit-user-select: none;
      }
      #cameraButton {
        width: 150px;
        height: 50px;
      }
      #cameraButton * {
        width: 100%;
        height: 100%;
      }
      /* #background {
      width: var(--resultSize);
      height: var(--resultSize);
      
      transition: none;
    } */
    </style>
    <link rel="stylesheet" href="planet.css" />
  </head>
  <body onload="load()">
    <header>
      <h1 id="title">Planet Generator 2</h1>
      <h2>Create Planet,Discover Universe</h2>
    </header>
    <hr />
    <div id="workspace">
      <div id="result" style="background-color: rgba(0, 0, 0, 0.5)">
        <div id="planet">
          <img id="asterism" src="image/asterism0.png" style="opacity: 0.7" />
          <div id="star" style="opacity: 1"></div>
          <div id="innerLight"></div>
          <img id="iceSheet" src="image/iceSheet0.png" />
          <canvas id="shadow" width="160" height="160"></canvas>
          <img
            class="ring"
            id="ringFront"
            src="image/ring2.png"
            loading="lazy" />
          <img
            class="ring"
            id="ringBehind"
            src="image/ring2.png"
            loading="lazy" />
          <img id="cloud" src="image/cloudGas0.png" alt="" />
          <img id="detail" src="image/detail0.png" alt="" />
          <div id="base"></div>
        </div>
        <!-- <img src="image/bg1.jpg"  id="background" /> -->
      </div>
      <hr />
      <div id="control" style="position: relative; z-index: 999">
        <div style="max-width: 500px">
          <button onclick="randomGenerate();Math.seed=Math.random()">
            随机生成
          </button>
          <!-- <button onclick="changeMode('displayData',this);">切换数据显示模式</button> -->
          <button onclick="changeMode('useCustomData',this)">打开工作台</button>
          <button onclick="changeMode('displayStar',this)">隐藏恒星</button>
          <button
            onclick="changeMode('displayShadow',this)"
            id="showShadowButton"
            style="display: none">
            隐藏阴影
          </button>
          <!-- <button onclick="this.style.display = 'none';document.getElementById('result').style.resize='both';document.getElementById('information').innerHTML='已切换，刷新页面即可关闭并回到默认状态'">自由调节画布大小</button> -->
          <button
            onclick="changeMode('displayBackground',this)"
            id="showBackgroundButton">
            隐藏背景
          </button>
          <button onclick="location.search=''">返回默认界面</button>
          <input
            id="seedEdit"
            autocomplete="off"
            onchange="Math.seed = this.value;randomGenerate();Math.seed=Math.random()"
            placeholder="请输入种子（仅限数字）" />
          <button onclick="shareSeed()">保存种子</button>
          <button onclick="changeMode('useAnimation',this)">关闭动画</button>
          <!-- <button
            onclick="changeMode('revolution', this)"
            id="revolutionButton">
            开始自转
          </button> -->
          <button onclick="fullScreen()" id="fullScreen" style="display: none">
            全屏
          </button>
          <hr />
          <span style="display: flex" id="cameraButton">
            <button id="moveLeft">←</button>
            <span style="display: flex; flex-direction: column">
              <button id="moveUp">↑</button>
              <button id="moveDown">↓</button>
            </span>
            <button id="moveRight">→</button>
          </span>
          <span>
            <div id="joystickInner"></div>
            <div id="joystickCircle"></div>
          </span>
          <button id="scaleUp">|← →|</button>
          <button id="scaleDown">|→ ←|</button>
          <button id="rotateSub">↺</button>
          <button id="rotateAdd">↻</button>
          <button onclick="goHome()">回到原位</button>
          <button onclick="help()">?</button>
        </div>
        <hr />
        <span id="customData" style="display: none">
          <textarea
            id="customDataArea"
            cols="50"
            rows="40"
            placeholder="请输入行星JSON数据"
            style="width: 100%; max-width: 500px; height: 250px"
            onchange="try{currentPlanetData = JSON.parse(this.value);generate(JSON.parse(this.value));this.style.backgroundColor='unset'}catch(err){this.style.backgroundColor='#ff000011';document.getElementById('information').innerHTML=err;console.error(err)}"></textarea>
          <button onclick="shareData()">保存数据</button>
          <button onclick="window.open('./customDataHelp.html', '_blank');">
            ?
          </button>
          <hr />
        </span>
        <pre
          id="information"
          style="
            word-wrap: break-word;
            word-break: break-all;
            white-space: pre-wrap;
          ">
加载完成!</pre
        >
      </div>
      <div id="project">
        <p>
          Contributor:<a href="https://github.com/Nsakrty">Nsakrty</a>,<a
            href="https://v.douyin.com/irWrBwB9/"
            >Hliva</a
          >,<a href="https://v.douyin.com/ifjgtuH4/">Earth</a>,<a
            href="https://space.bilibili.com/1595229142"
            >Firstclassuniver</a
          >
        </p>
        <p>
          Github:<a href="https://github.com/Nsakrty/PlanetGenerator2"
            >Click me</a
          >
        </p>
      </div>
    </div>
    <script src="generator.js"></script>
    <script src="shadowDrawing.js"></script>
    <script src="colorTranslate.js"></script>
    <script src="longPress.js"></script>
    <script src="camera.js"></script>
    <script src="event.js"></script>
    <script>
      let currentPlanetData = {
        seed: "Home",
        type: "Gaseous",
        color: "#c1a77c",
        radiusPercent: "0.4",
        rotate: "-12deg",
        revolutionPeriodSeconds: 28000,
        atmosphere: {
          size: "14px",
        },
        ring: {
          rotate: "0deg",
          rotateX: "67deg",
          color: "58deg",
          skin: 2,
          opacity: 1,
          size: 1,
        },
        shadow: {
          size: 0.83,
          direction: 0,
        },
        star: {
          radiusPercent: "0.04",
          spectrum: "G",
          color: "#fff4ea",
          asterismColor: "-1.4285714285713844deg",
          asterismBrightness: "0.9588235294117646",
        },
        cloud: {
          rotate: "9deg",
          opacity: 0.65,
          skin: 0,
        },
      };

      result = document.getElementById("result");
      function load() {
        document.getElementById("result").style.backgroundColor =
          "rgba(0,0,0,0.5)";
        drawShadowWithAnimation(
          (currentShadowSize = currentPlanetData.shadow.size),
          (currentShadowDirection = currentPlanetData.shadow.direction)
        ); //行星光照初始化
        generate(currentPlanetData);
        document.getElementById("information").innerHTML = "加载完成!";
        // 检测FullScreen API是否可用
        if (document.fullscreenEnabled) {
          document.getElementById("fullScreen").style.display = "initial";
        }
      }
      function shareSeed() {
        let shareSeed = "";
        try {
          shareSeed = `${currentPlanetData.seed}`;
        } catch {
          void 0;
        }
        let copyEvent = navigator.clipboard.writeText(shareSeed);
        shareSeed = shareSeed ? shareSeed : "目前无种子";
        document.getElementById("information").innerHTML =
          "行星种子:" + shareSeed;
      }
      function shareData() {
        let shareData = "";
        try {
          shareData = `${JSON.stringify(currentPlanetData)}`;
        } catch {
          void 0;
        }
        let copyEvent = navigator.clipboard.writeText(shareData);
        document.getElementById("information").innerHTML =
          "行星数据已复制到剪贴板";
      }
      function changeMode(name, runElement) {
        switch (name) {
          // case "displayData":
          //   config.showPlanetData ^= 1;
          //   document.getElementById("information").innerHTML = "已切换，效果将在下次生成时应用。";
          //   break;
          case "displayStar":
            runElement.innerHTML = (config.showStar ^= 1)
              ? "隐藏恒星"
              : "显示恒星";
            if (!config.showShadow)
              changeMode(
                "displayShadow",
                document.getElementById("showShadowButton")
              );
            document.getElementById("showShadowButton").style.display =
              !config.showStar ? "initial" : "none";
            document.getElementById("star").style.display = config.showStar
              ? "block"
              : "none";
            document.getElementById("asterism").style.display = config.showStar
              ? "block"
              : "none";
            document.getElementById("information").innerHTML = "切换成功";
            break;
          case "displayShadow":
            runElement.innerHTML = (config.showShadow ^= 1)
              ? "隐藏阴影"
              : "显示阴影";
            document.getElementById("shadow").style.display = config.showShadow
              ? "block"
              : "none";
            document.getElementById("information").innerHTML = "切换成功";
            break;
          case "displayBackground":
            runElement.innerHTML = (config.showBackground ^= 1)
              ? "隐藏背景"
              : "显示背景";
            document.getElementById("result").style.backgroundImage =
              config.showBackground ? "url(image/bg0.png)" : "none";
            document.getElementById("result").style.backgroundColor =
              config.showBackground ? "#00000099" : "#000000";
            document.getElementById("information").innerHTML = "切换成功";
            break;
          case "useAnimation":
            config.useAnimation ^= 1;
            setAnimationTime();
            runElement.innerHTML = config.useAnimation
              ? "关闭动画"
              : "开启动画";
            document.getElementById("information").innerHTML =
              "已切换，效果将在下次生成时应用。";
            break;
          case "useCustomData":
            config.useCustomData ^= 1;
            runElement.innerHTML = config.useCustomData
              ? "关闭工作台"
              : "打开工作台";
            document.getElementById("customData").style.display =
              config.useCustomData ? "block" : "none";
            document.getElementById("information").innerHTML = "已切换";
            break;
          case "revolution":
            // 开发中！
            config.revolution ^= 1;
            runElement.innerHTML = config.revolution ? "关闭自转" : "开启自转";
            if (config.revolution) {
              revolve();
            }
            document.getElementById("information").innerHTML = "已切换。";
            break;
        }
      }
      function setAnimationTime() {
        document
          .getElementById("result")
          .style.setProperty(
            "--animationDuringTime",
            config.useAnimation ? "0.3s" : "0s"
          );
      }

      function revolve(timeRate = 1) {
        drawShadowWithAnimation(
          currentPlanetData.shadow.size,
          currentPlanetData.shadow.direction ^ 1,
          currentPlanetData.revolutionPeriodSeconds / timeRate / 2
        ).then(() => {
          drawShadowWithAnimation(
            currentPlanetData.shadow.size,
            currentPlanetData.shadow.direction,
            currentPlanetData.revolutionPeriodSeconds / timeRate / 2
          ).then(() => {
            if (config.revolution) {
              revolve();
            }
          });
        });
      }
    </script>
    <script>
      function goHome() {
        moveX(0, "set");
        moveY(0, "set");
        scale(1, "set");
        rotate(0, "set");
      }
      function help() {
        alert(
          "按钮操作方式:\n1.点击或长按按钮操作\n2.使用快捷键操作\n\n键位解释和快捷键:\n←:快捷键(A)，左移\n→:快捷键(D)，右移\n↑:快捷键(W)，上移\n↓:快捷键(S)，下移\n|← →|:快捷键(+或者=)，放大\n|→ ←|:快捷键(-)，缩小\n↺:快捷键(Q)，逆时针旋转\n↻:快捷键(E)，顺时针旋转\n回到原位:快捷键(H)，回到原位\n背景切换:快捷键(V)，切换背景显示\n随机生成:快捷键(G)，随机生成\n全屏:快捷键(F)，全屏"
        );
      }
      function fullScreen() {
        const fullScreenElement = document.getElementById("result");
        let isFullScreen = document.fullscreenElement;
        if (isFullScreen) {
          document.exitFullscreen();
        } else {
          fullScreenElement.requestFullscreen();
        }
      }
    </script>
  </body>
</html>
